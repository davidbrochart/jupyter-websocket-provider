[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jupyter-websocket-provider"
version = "0.1.0"
description = "A WebSocket relay for shared Jupyter documents"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "anyio>=4,<5",
    "jupyter-collaboration-ui>=3.1.0a2,<4.0.0",
    "jupyter-docprovider>=3.1.0a2,<4.0.0",
    "jupyter-server>=2.21.1,<3",
    "watchfiles>=1.0,<2",
]

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_websocket_provider.json" = "etc/jupyter/jupyter_server_config.d/jupyter_websocket_provider.json"
"jupyter_websocket_provider/labextension" = "share/jupyter/labextensions/jupyter-websocket-provider"

[tool.hatch.build.targets.wheel]
exclude = ["jupyter_websocket_provider/labextension"]

[tool.hatch.build.targets.sdist]
include = [
    "jupyter-config",
    "jupyter_websocket_provider",
    "package.json",
    "src",
    "LICENSE",
    "README.md",
]
